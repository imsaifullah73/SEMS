<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — SEMS</title>
  <meta name="theme-color" content="#2B3467" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/themes/light.css" />
  <link rel="stylesheet" href="css/themes/dark.css" />
  <link rel="stylesheet" href="css/themes/typography.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sems_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="auth-page">
    <button type="button" class="theme-toggle auth-theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    </button>
    <div class="auth-card card">
      <div class="auth-card__brand">
        <div class="sidebar__brand-mark">S</div>
        <span class="sidebar__brand-name">SEMS</span>
      </div>
      <h2 style="text-align:center; margin-bottom: var(--space-1);">Welcome back</h2>
      <p class="text-secondary" style="text-align:center; margin-bottom: var(--space-6);">Log in to your account</p>

      <p class="auth-error" data-auth-error></p>

      <form class="form" data-login-form novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" class="form-input" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" class="form-input" required />
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;">Log In</button>
      </form>

      <form class="form" data-otp-form hidden>
        <p class="text-secondary" data-otp-hint></p>
        <div class="form-group">
          <label for="login-otp">Verification code</label>
          <input id="login-otp" name="otp" type="text" class="form-input" inputmode="numeric" maxlength="6" required />
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;">Verify Email</button>
        <button type="button" class="btn btn--secondary" style="width:100%; margin-top: var(--space-2);" data-resend-otp>Resend code</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>

  <script type="module" src="js/ui/pages/loginPage.js"></script>
</body>
</html>
